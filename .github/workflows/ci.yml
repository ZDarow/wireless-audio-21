---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Минимальные права (GIT_AUDIT CI-2): checkout-токен только для чтения.
permissions:
  contents: read

# Отменяет предыдущий запуск на той же ветке (GIT_AUDIT CI-6).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    # Страховка от зависших сборок (GIT_AUDIT CI-3).
    timeout-minutes: 30
    steps:
      # Actions закреплены по SHA коммитов (GIT_AUDIT CI-4, supply chain):
      #   checkout@v4         → 11d5960a326750d5838078e36cf38b85af677262
      #   setup-python@v5     → a26af69be951a213d495a4c3e4e4022e16d87065
      #   actions/cache@v4    → 0057852bfaa89a56745cba8c7296529d2fc39830
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up ESP-IDF v5.3.1
        uses: espressif/esp-idf-ci-action@v2
        with:
          idf-version: release/v5.3
          path: ${{ runner.workspace }}/esp-idf

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Generate config
        run: |
          cp config.example.env config.env
          python3 scripts/generate_config.py config.env

      - name: Host tests (gcc, без железа)
        run: make -C test test

      - name: Build master IDF
        run: |
          cd firmware/master_s3_idf
          idf.py build

      - name: Build satellite left IDF
        run: |
          cd firmware/satellite_s3_idf_left
          idf.py build

      - name: Build satellite right IDF
        run: |
          cd firmware/satellite_s3_idf_right
          idf.py build

      - name: Lint (clang-format check)
        run: |
          if command -v clang-format >/dev/null 2>&1; then
            clang-format --dry-run --Werror \
              firmware/**/*.cpp firmware/**/*.h test/*.cpp 2>&1 || true
          else
            echo "clang-format не установлен — пропускаем форматирование"
          fi
