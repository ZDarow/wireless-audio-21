---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Минимальные права (GIT_AUDIT CI-2): checkout-токен только для чтения.
permissions:
  contents: read

# Отменяет предыдущий запуск на той же ветке (GIT_AUDIT CI-6).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    # Страховка от зависших сборок (GIT_AUDIT CI-3).
    timeout-minutes: 30
    steps:
      # Actions закреплены по SHA коммитов (GIT_AUDIT CI-4, supply chain):
      #   checkout@v4         → 11d5960a326750d5838078e36cf38b85af677262
      #   setup-python@v5     → a26af69be951a213d495a4c3e4e4022e16d87065
      #   actions/cache@v4    → 0057852bfaa89a56745cba8c7296529d2fc39830
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        # T18: фиксируем версию — воспроизводимая сборка.
        run: pipx install platformio==6.1.19

      - name: Cache PlatformIO packages
        # T18: кэшируем пакеты платформ/фреймворков и изолированный
        # core-каталог мастера (pioarduino core 3.x) — ускорение повторных
        # запусков.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
            .pio-core-master
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'platformio.master.ini') }}

      - name: Generate config
        run: |
          cp config.example.env config.env
          python3 scripts/generate_config.py config.env

      - name: Host tests (gcc, без железа)
        run: make -C test test

      - name: Build master (ESP32-S3, Wi-Fi UDP, pioarduino core 3.x)
        # master_s3_wifi собирается на pioarduino-платформе (NAPT в lwip),
        # core которой изолирован в platformio.master.ini (core_dir),
        # чтобы не конфликтовать с фреймворком сателлитов (core 2.0.17).
        run: pio run -c platformio.master.ini

      - name: Build satellites (ESP32-S3)
        run: |
          pio run -e satellite_s3_left
          pio run -e satellite_s3_right
