---
# Автоматические обновления зависимостей (GIT_AUDIT H5).
# Python-скрипты (scripts/, test/) используют только stdlib — manifest
# requirements.txt не требуется; пины python/actions обновляет Dependabot.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
