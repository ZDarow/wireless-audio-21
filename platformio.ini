; Wireless Audio 2.1 — PlatformIO configuration
;
; Три окружения:
;   master_a2dp      — мастер-узел (сабвуфер): A2DP/Wi-Fi вход, DSP, кроссовер,
;                      ESP-NOW/UDP TX на сателлиты, локальный I2S на сабвуфер.
;   satellite_left   — левый беспроводной сателлит.
;   satellite_right  — правый беспроводной сателлит.
;
; Адаптация под ESP32-S3 (см. docs/PLAN.md, ТЗ):
;   master_s3_wifi       — мастер на ESP32-S3-N16R8, источник — Wi-Fi UDP PCM.
;   satellite_s3_left    — сателлит на ESP32-S3.
;   satellite_s3_right   — сателлит на ESP32-S3.
;
; Общий код (firmware/common) — header-only, подключается через build_flags -I.
; Каждое окружение компилирует только свой src_dir.

[platformio]
default_envs = master_s3_wifi
; Общий корень исходников. Конкретный подкаталог (master/src или satellite/src)
; выбирается в каждом env через build_src_filter (src_dir в [env] не поддерживается).
src_dir = firmware

[common]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
board = esp32dev
; ESP32-A2DP + audio-tools (Bluetooth, SBC) не влезают в дефолтную partition
; (1.31MB app). huge_app.csv даёт ~3MB под приложение (без OTA).
board_build.partitions = huge_app.csv
; arduino-audio-tools (pschatzmann) отсутствует в реестре PlatformIO — подключается
; git-URL'ом. Нужен как зависимость ESP32-A2DP и для Wi-Fi-источника (этап 4).
;
; U8g2 / RotaryEncoder / ArduinoJson (OLED, энкодер, Web UI) в MVP не используются
; и раздувают прошивку — подключаются в этапе 4 (расширения).
; Preferences нужна всем (storage.h/wifi_store.h); на pioarduino core 3.x она
; НЕ встроена в фреймворк — тянем отдельно. WebServer/HTTPClient/Update/Network
; встроены в Arduino core (T22).
lib_deps =
    Preferences

; Общие include-пути (common, header-only)
; GENERATED_CONFIG_H включает сгенерированный generated_config.h в node_config.h.
build_flags =
    -DGENERATED_CONFIG_H
    -I firmware/common
    -I firmware/common/audio
    -I firmware/common/transport
    -I firmware/common/config
    -I firmware/common/ui
    -I firmware/common/util
    -I firmware/common/web
    -I firmware/common/generated

; ---------- Мастер-узел ----------
[env:master_a2dp]
extends = common
build_src_filter = +<master/src>
build_flags =
    ${common.build_flags}
    -I firmware/master/include
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
lib_deps =
    ${common.lib_deps}
    bblanchon/ArduinoJson@^7.0.0
    ; T11: git-зависимости зафиксированы по SHA (воспроизводимая сборка).
    https://github.com/pschatzmann/arduino-audio-tools.git#4ba48c9d4442d61e632597380ae842c34e6e1f92
    https://github.com/pschatzmann/ESP32-A2DP.git#3245602afc494f9e62160a0cfb2af864af45a37f
    WebServer
    HTTPClient
    Update

; ---------- Сателлиты ----------
[env:satellite_left]
extends = common
build_src_filter = +<satellite/src>
build_flags =
    ${common.build_flags}
    -I firmware/satellite/include
    -DAUDIO_SATELLITE_SIDE=0

[env:satellite_right]
extends = common
build_src_filter = +<satellite/src>
build_flags =
    ${common.build_flags}
    -I firmware/satellite/include
    -DAUDIO_SATELLITE_SIDE=1

; ---------- Мастер-узел ESP32-S3 (Wi-Fi UDP источник) ----------
; Собирается на pioarduino-платформе (Arduino core 3.3.11 / IDF 5.5.5, тег
; 55.03.311): только там lwip собран с CONFIG_LWIP_IP_FORWARD/CONFIG_LWIP_IPV4_NAPT
; и работает esp_netif_napt_enable() (режим репитера APSTA, F21). Официальная
; платформа 6.x/7.x (core 2.0.17) NAPT не содержит. Core-каталог изолирован
; через platformio.master.ini (core_dir=.pio-core-master) — пакет
; framework-arduinoespressif32 конфликтует с официальным (core 2.0.17), нужным
; сателлитам. Сборка: pio run -c platformio.master.ini
[env:master_s3_wifi]
extends = common
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_src_filter = +<master_s3/src>
build_flags =
    ${common.build_flags}
    -I firmware/master_s3/include
    -I firmware/master/include
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=2
; ESP32-A2DP/BluetoothA2DPSink не используются (S3 не поддерживает A2DP):
; источник — Wi-Fi UDP PCM. audio-tools не используется — удалён (C6.7).
; WebServer/HTTPClient/Update/Network на pioarduino core 3.x НЕ встроены
; в фреймворк (в отличие от официального espressif32@6.9.0) — тянутся отдельно.
lib_deps =
    ${common.lib_deps}
    WebServer
    HTTPClient
    Update
    Network
    bblanchon/ArduinoJson@^7.0.0

; ---------- Сателлиты ESP32-S3 ----------
; Flash/PSRAM зависят от конкретной платы (S3-WROOM-1 / S3 mini) — оставляем
; дефолты платы esp32-s3-devkitc-1, при необходимости переопределить.
[env:satellite_s3_left]
extends = common
board = esp32-s3-devkitc-1
build_src_filter = +<satellite/src>
build_flags =
    ${common.build_flags}
    -I firmware/satellite/include
    -DAUDIO_SATELLITE_SIDE=0

[env:satellite_s3_right]
extends = common
board = esp32-s3-devkitc-1
build_src_filter = +<satellite/src>
build_flags =
    ${common.build_flags}
    -I firmware/satellite/include
    -DAUDIO_SATELLITE_SIDE=1