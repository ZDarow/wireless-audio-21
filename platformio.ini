; Wireless Audio 2.1 — PlatformIO configuration
;
; Три окружения:
;   master_a2dp      — мастер-узел (сабвуфер): A2DP/Wi-Fi вход, DSP, кроссовер,
;                      ESP-NOW/UDP TX на сателлиты, локальный I2S на сабвуфер.
;   satellite_left   — левый беспроводной сателлит.
;   satellite_right  — правый беспроводной сателлит.
;
; Общий код (firmware/common) — header-only, подключается через build_flags -I.
; Каждое окружение компилирует только свой src_dir.

[platformio]
default_envs = master_a2dp

[common]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
board = esp32dev

; Общие библиотеки для всех узлов
lib_deps =
    pschatzmann/arduino-audio-tools@^0.9.0
    bblanchon/ArduinoJson@^7.0.0
    olikraus/U8g2@^2.35.0
    mathertel/RotaryEncoder@^1.1.4

; Общие include-пути (common, header-only)
build_flags =
    -I firmware/common
    -I firmware/common/audio
    -I firmware/common/transport
    -I firmware/common/config
    -I firmware/common/ui
    -I firmware/common/util
    -I firmware/common/generated

; ---------- Мастер-узел ----------
[env:master_a2dp]
extends = common
src_dir = firmware/master/src
build_flags =
    ${common.build_flags}
    -I firmware/master/include
    -DAUDIO_NODE_ROLE=MASTER
    -DAUDIO_SOURCE_MODE=A2DP
    -DAUDIO_TRANSPORT_MODE=ESPNOW
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
lib_deps =
    ${common.lib_deps}
    pschatzmann/ESP32-A2DP@^1.6.0

; ---------- Сателлиты ----------
[env:satellite_left]
extends = common
src_dir = firmware/satellite/src
build_flags =
    ${common.build_flags}
    -I firmware/satellite/include
    -DAUDIO_NODE_ROLE=SATELLITE
    -DAUDIO_SATELLITE_SIDE=LEFT

[env:satellite_right]
extends = common
src_dir = firmware/satellite/src
build_flags =
    ${common.build_flags}
    -I firmware/satellite/include
    -DAUDIO_NODE_ROLE=SATELLITE
    -DAUDIO_SATELLITE_SIDE=RIGHT