; Отдельный конфиг для master_s3_wifi: использует ИЗОЛИРОВАННЫЙ PlatformIO core
; (core_dir = .pio-core-master), чтобы пакет framework-arduinoespressif32
; (Arduino core 3.3.11 от pioarduino) не конфликтовал с таким же пакетом
; официальной платформы espressif32@6.9.0 (core 2.0.17), который нужен
; сателлитам (legacy I2S API). Обе платформы в одном core-каталоге
; перезаписывают друг друга — отсюда отдельный core.
;
; Сборка мастера:
;   pio run -c platformio.master.ini
; Сборка сателлитов (обычный platformio.ini):
;   pio run -e satellite_s3_left -e satellite_s3_right

[platformio]
core_dir = .pio-core-master
extra_configs = platformio.ini
